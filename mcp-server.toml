server_id = "mcp_browser"
display_name = "Browser"
version = "1.1.0"
domain = "browser"
sdk_version = "0.2.0"
risk_level = "low"
writes_allowed = "none"
transports = ["stdio"]
credentials = []
governance_gates = []
environments = ["development", "staging", "production"]

[[tools]]
name = "read_page"
description = "Fetch a URL and return clean readable text (markdown-friendly, no HTML noise)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_html"
description = "Get full rendered HTML of a page (after JavaScript execution)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "extract_links"
description = "Extract all links from a page (href + text)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "extract_metadata"
description = "Extract page metadata: title, description, OG tags, canonical URL"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "query_selector"
description = "Query elements matching a CSS selector — returns their text content"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_accessibility_tree"
description = "Get the accessibility tree of a page (structured, low-token representation)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "extract_structured"
description = "Extract structured data from a page using CSS selectors (e.g. {\"title\": \"h1\", \"price\": \".price\"})"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "screenshot"
description = "Take a full-page screenshot (returns base64 PNG)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "screenshot_element"
description = "Screenshot a specific element by CSS selector"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "save_pdf"
description = "Save a page as PDF (returns base64)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "click"
description = "Click an element by CSS selector"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "type_text"
description = "Type text into an input field"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "evaluate_js"
description = "Execute JavaScript on a page and return the result"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "wait_for"
description = "Wait for an element to appear on the page"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "navigate"
description = "Navigate to URL and return page info (status, title, load time)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "check_status"
description = "Check URL status without rendering (HTTP HEAD — fast)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "fetch_light"
description = "Fetch page with lightweight HTTP (no Chrome, fast, for simple pages)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []
