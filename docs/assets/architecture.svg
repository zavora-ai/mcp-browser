<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui,-apple-system,sans-serif" font-size="13">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="httpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" rx="12" fill="#0f172a"/>
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">mcp-browser — Architecture</text>
  <rect x="250" y="55" width="300" height="50" rx="8" fill="url(#headerGrad)" opacity="0.9"/>
  <text x="400" y="85" text-anchor="middle" fill="white" font-weight="bold" font-size="14">MCP Client (AI Agent)</text>
  <line x1="400" y1="105" x2="400" y2="135" stroke="#94a3b8" stroke-width="2"/>
  <text x="415" y="125" fill="#94a3b8" font-size="11">stdio (JSON-RPC)</text>
  <rect x="80" y="140" width="640" height="200" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="400" y="165" text-anchor="middle" fill="#e2e8f0" font-weight="bold" font-size="14">mcp-browser server</text>
  <rect x="120" y="180" width="560" height="40" rx="6" fill="#334155"/>
  <text x="400" y="205" text-anchor="middle" fill="#a5b4fc" font-weight="bold">Tool Router — 17 tools</text>
  <rect x="120" y="230" width="130" height="30" rx="4" fill="#312e81"/>
  <text x="185" y="250" text-anchor="middle" fill="#c7d2fe" font-size="11">Read and Extract (7)</text>
  <rect x="260" y="230" width="100" height="30" rx="4" fill="#312e81"/>
  <text x="310" y="250" text-anchor="middle" fill="#c7d2fe" font-size="11">Visual (3)</text>
  <rect x="370" y="230" width="100" height="30" rx="4" fill="#312e81"/>
  <text x="420" y="250" text-anchor="middle" fill="#c7d2fe" font-size="11">Interact (4)</text>
  <rect x="480" y="230" width="110" height="30" rx="4" fill="#312e81"/>
  <text x="535" y="250" text-anchor="middle" fill="#c7d2fe" font-size="11">Navigate (3)</text>
  <rect x="120" y="280" width="270" height="45" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="255" y="300" text-anchor="middle" fill="#a5b4fc" font-weight="bold" font-size="12">BrowserEngine</text>
  <text x="255" y="316" text-anchor="middle" fill="#818cf8" font-size="11">headless_chrome (CDP)</text>
  <rect x="420" y="280" width="270" height="45" rx="6" fill="#022c22" stroke="#059669" stroke-width="1"/>
  <text x="555" y="300" text-anchor="middle" fill="#6ee7b7" font-weight="bold" font-size="12">Lightweight HTTP</text>
  <text x="555" y="316" text-anchor="middle" fill="#34d399" font-size="11">reqwest (no Chrome)</text>
  <line x1="255" y1="340" x2="255" y2="380" stroke="#818cf8" stroke-width="2"/>
  <text x="270" y="365" fill="#818cf8" font-size="10">CDP</text>
  <line x1="555" y1="340" x2="555" y2="380" stroke="#34d399" stroke-width="2"/>
  <text x="570" y="365" fill="#34d399" font-size="10">HTTP</text>
  <rect x="120" y="385" width="270" height="120" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="255" y="410" text-anchor="middle" fill="#fbbf24" font-weight="bold" font-size="13">Chromium (headless)</text>
  <text x="255" y="432" text-anchor="middle" fill="#fcd34d" font-size="11">JavaScript execution</text>
  <text x="255" y="450" text-anchor="middle" fill="#fcd34d" font-size="11">Full DOM rendering</text>
  <text x="255" y="468" text-anchor="middle" fill="#fcd34d" font-size="11">Screenshots and PDFs</text>
  <text x="255" y="486" text-anchor="middle" fill="#fcd34d" font-size="11">Accessibility tree</text>
  <rect x="420" y="385" width="270" height="80" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1"/>
  <text x="555" y="410" text-anchor="middle" fill="#6ee7b7" font-weight="bold" font-size="13">Target Website</text>
  <text x="555" y="432" text-anchor="middle" fill="#a7f3d0" font-size="11">Static HTML pages</text>
  <text x="555" y="450" text-anchor="middle" fill="#a7f3d0" font-size="11">APIs and simple content</text>
</svg>
